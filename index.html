<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiFrota 4.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-20 font-sans">

    <!-- CABEÇALHO -->
    <header class="bg-blue-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid font-bold text-xl fa-car-side"></i>
            <h1 class="text-lg font-bold tracking-wide">DigiFrota 4.1</h1>
        </div>
        <span id="status-conexao" class="text-xs bg-blue-900 px-2.5 py-1 rounded-full text-blue-200">
            Conectando...
        </span>
    </header>

    <!-- CONTEÚDO PRINCIPAL DO APP -->
    <main class="max-w-md mx-auto p-4">

        <!-- ABA 1: FORMULÁRIO -->
        <section id="aba-nova-viagem" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-route text-blue-600"></i> Registrar Nova Viagem
                </h2>

                <form id="form-viagem" onsubmit="salvarViagem(event)" class="space-y-4">
                    
                    <!-- Motorista -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Motorista</label>
                        <select id="motorista" required
                            class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition">
                            <option value="">Carregando motoristas...</option>
                        </select>
                    </div>

                    <!-- Frota -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Frota / Veículo</label>
                        <select id="frota" required onchange="aoSelecionarFrota()"
                            class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition">
                            <option value="">Carregando frotas...</option>
                        </select>
                    </div>

                    <!-- KM Saída -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">KM Saída</label>
                        <div class="relative">
                            <input type="number" id="kmSaida" required placeholder="Ex: 45000"
                                class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition">
                            <span id="loading-km" class="hidden absolute right-3 top-3 text-xs text-blue-600">Busca automatica...</span>
                        </div>
                    </div>

                    <!-- Destino -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Destino</label>
                        <select id="destino" required
                            class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition">
                            <option value="">Carregando destinos...</option>
                        </select>
                    </div>

                    <!-- Foto Hodômetro -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Foto do Hodômetro</label>
                        <input type="file" id="fotoHodometro" accept="image/*" capture="environment" onchange="converterFotoBase64()"
                            class="hidden">
                        <label for="fotoHodometro" 
                            class="w-full p-3 bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl text-blue-700 flex items-center justify-center gap-2 cursor-pointer hover:bg-blue-100 transition text-sm font-medium">
                            <i class="fa-solid fa-camera text-lg"></i>
                            <span id="label-foto">Tirar Foto / Anexar</span>
                        </label>
                        <input type="hidden" id="fotoBase64">
                    </div>

                    <!-- Botão Salvar -->
                    <button type="submit" id="btn-enviar"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold p-3.5 rounded-xl shadow-lg transition flex justify-center items-center gap-2 text-base mt-2">
                        <i class="fa-solid fa-paper-plane"></i> Registrar Viagem
                    </button>
                </form>
            </div>
        </section>

        <!-- ABA 2: HISTÓRICO -->
        <section id="aba-historico" class="hidden space-y-3">
            <h2 class="text-base font-bold text-gray-800 mb-2 px-1 flex justify-between items-center">
                <span><i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Últimas Viagens</span>
                <button onclick="carregarHistorico()" class="text-xs text-blue-700 font-semibold">Atualizar</button>
            </h2>

            <div id="lista-cards-historico" class="space-y-3">
                <p class="text-center text-gray-500 text-sm py-8">Carregando histórico...</p>
            </div>
        </section>

    </main>

    <!-- BARRA NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-50">
        <button onclick="mudarAba('nova-viagem')" id="nav-nova-viagem" class="flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs">
            <i class="fa-solid fa-circle-plus text-lg"></i>
            <span>Nova Viagem</span>
        </button>
        <button onclick="mudarAba('historico')" id="nav-historico" class="flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs">
            <i class="fa-solid fa-list text-lg"></i>
            <span>Histórico</span>
        </button>
    </nav>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyN0w7YVnTzjVyXFyKcUaguw4j-KDOk_Tlt7MueC3DdnbNrenk_rxaqx-ZffXnJFkDCFg/exec";

        document.addEventListener("DOMContentLoaded", () => {
            carregarMotoristas();
            carregarFrotas();
            carregarDestinos();
            carregarHistorico();
        });

        function mudarAba(aba) {
            const secNova = document.getElementById("aba-nova-viagem");
            const secHist = document.getElementById("aba-historico");
            const btnNova = document.getElementById("nav-nova-viagem");
            const btnHist = document.getElementById("nav-historico");

            if (aba === 'nova-viagem') {
                secNova.classList.remove("hidden");
                secHist.classList.add("hidden");
                btnNova.className = "flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs";
                btnHist.className = "flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs";
            } else {
                secNova.classList.add("hidden");
                secHist.classList.remove("hidden");
                btnHist.className = "flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs";
                btnNova.className = "flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs";
            }
        }

        async function carregarMotoristas() {
            try {
                const res = await fetch(`${API_URL}?action=getMotoristas`);
                const motoristas = await res.json();
                const select = document.getElementById("motorista");
                select.innerHTML = '<option value="">Selecione o motorista...</option>';
                motoristas.forEach(m => {
                    select.innerHTML += `<option value="${m}">${m}</option>`;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function carregarFrotas() {
            try {
                const res = await fetch(`${API_URL}?action=getFrotasEmOperacao`);
                const frotas = await res.json();
                const select = document.getElementById("frota");
                select.innerHTML = '<option value="">Selecione o veículo...</option>';
                frotas.forEach(f => {
                    select.innerHTML += `<option value="${f}">${f}</option>`;
                });
                document.getElementById("status-conexao").textContent = "Online";
            } catch (e) {
                console.error(e);
            }
        }

        async function carregarDestinos() {
            try {
                const res = await fetch(`${API_URL}?action=getDestinos`);
                const destinos = await res.json();
                const select = document.getElementById("destino");
                select.innerHTML = '<option value="">Selecione o destino...</option>';
                destinos.forEach(d => {
                    select.innerHTML += `<option value="${d}">${d}</option>`;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function aoSelecionarFrota() {
            const frota = document.getElementById("frota").value;
            const inputKm = document.getElementById("kmSaida");
            const loadingKm = document.getElementById("loading-km");

            if (!frota) return;

            loadingKm.classList.remove("hidden");
            try {
                const res = await fetch(`${API_URL}?action=getUltimoKm&frota=${encodeURIComponent(frota)}`);
                const data = await res.json();
                if (data.ultimoKm) {
                    inputKm.value = data.ultimoKm;
                }
            } catch (e) {
                console.error(e);
            } finally {
                loadingKm.classList.add("hidden");
            }
        }

        function converterFotoBase64() {
            const fileInput = document.getElementById("fotoHodometro");
            const labelFoto = document.getElementById("label-foto");
            const inputBase64 = document.getElementById("fotoBase64");

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                labelFoto.textContent = "Foto Anexada ✓";
                reader.onload = function(e) {
                    inputBase64.value = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        async function salvarViagem(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-enviar");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';

            const agora = new Date();
            const dataSaida = agora.toLocaleDateString("pt-BR");
            const horaSaida = agora.toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });

            const payload = {
                motorista: document.getElementById("motorista").value,
                frota: document.getElementById("frota").value,
                kmSaida: document.getElementById("kmSaida").value,
                destino: document.getElementById("destino").value,
                fotoBase64: document.getElementById("fotoBase64").value,
                dataSaida: dataSaida,
                horaSaida: horaSaida,
                situacao: "EM ANDAMENTO"
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const resp = await res.json();

                if (resp.status === "sucesso") {
                    alert("Viagem registrada com sucesso!");
                    document.getElementById("form-viagem").reset();
                    document.getElementById("label-foto").textContent = "Tirar Foto / Anexar";
                    document.getElementById("fotoBase64").value = "";
                    carregarHistorico();
                    mudarAba('historico');
                } else {
                    alert("Erro ao registrar: " + resp.mensagem);
                }
            } catch (err) {
                alert("Erro de comunicação com o servidor.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Registrar Viagem';
            }
        }

        async function carregarHistorico() {
            const container = document.getElementById("lista-cards-historico");
            try {
                const res = await fetch(`${API_URL}?action=obterDadosFrotas`);
                const dados = await res.json();

                if (dados && dados.length > 0) {
                    container.innerHTML = "";
                    dados.slice(0, 15).forEach(v => {
                        container.innerHTML += `
                            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-blue-800 text-sm">${v.frota}</span>
                                    <span class="text-xs px-2 py-0.5 rounded font-semibold bg-blue-50 text-blue-700">${v.situacao}</span>
                                </div>
                                <div class="text-xs text-gray-600 space-y-1">
                                    <p><strong class="text-gray-800">Motorista:</strong> ${v.motorista}</p>
                                    <p><strong class="text-gray-800">Destino:</strong> ${v.destino}</p>
                                    <p><strong class="text-gray-800">Saída:</strong> ${v.saida}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p class="text-center text-gray-500 text-sm py-6">Nenhuma viagem registrada ainda.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p class="text-center text-red-500 text-sm py-6">Erro ao carregar histórico.</p>';
            }
        }
    </script>
</body>
</html>
