<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiFrota 4.1 - Gestão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-blue-800">DigiFrota 4.1 - Painel de Controle</h1>
            <span id="status-conexao" class="text-sm text-gray-500">Carregando dados...</span>
        </header>

        <!-- Tabela de Viagens -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-50 text-blue-900 border-b">
                        <th class="p-3">Frota</th>
                        <th class="p-3">Motorista</th>
                        <th class="p-3">Destino</th>
                        <th class="p-3">Saída</th>
                        <th class="p-3">Retorno</th>
                        <th class="p-3">KM Rodado</th>
                        <th class="p-3">Situação</th>
                    </tr>
                </thead>
                <tbody id="tabela-viagens">
                    <tr><td colspan="7" class="p-4 text-center text-gray-500">Buscando viagens na planilha...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyN0w7YVnTzjVyXFyKcUaguw4j-KDOk_Tlt7MueC3DdnbNrenk_rxaqx-ZffXnJFkDCFg/exec";

        async function carregarDados() {
            const statusEl = document.getElementById("status-conexao");
            const tbody = document.getElementById("tabela-viagens");

            try {
                const response = await fetch(`${API_URL}?action=obterDadosFrotas`);
                const dados = await response.json();

                if (dados && dados.length > 0) {
                    statusEl.textContent = `Conectado (${dados.length} registros)`;
                    tbody.innerHTML = "";

                    dados.forEach(v => {
                        const tr = document.createElement("tr");
                        tr.className = "border-b hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="p-3 font-semibold text-blue-700">${v.frota}</td>
                            <td class="p-3">${v.motorista}</td>
                            <td class="p-3">${v.destino}</td>
                            <td class="p-3 text-sm text-gray-600">${v.saida}</td>
                            <td class="p-3 text-sm text-gray-600">${v.retorno}</td>
                            <td class="p-3 font-medium">${v.kmRodado}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs bg-green-100 text-green-800 font-bold">${v.situacao}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    statusEl.textContent = "Nenhum registro encontrado.";
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">Nenhuma viagem encontrada.</td></tr>`;
                }
            } catch (erro) {
                console.error(erro);
                statusEl.textContent = "Erro ao conectar com a API.";
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500">Erro ao carregar dados. Verifique a URL da API.</td></tr>`;
            }
        }

        carregarDados();
    </script>
</body>
</html>
