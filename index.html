<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiFrota 4.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-20 font-sans">

    <header class="bg-blue-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid font-bold text-xl fa-car-side"></i>
            <h1 class="text-lg font-bold tracking-wide">DigiFrota 4.1</h1>
        </div>
        <span id="status-conexao" class="text-xs bg-blue-900 px-2.5 py-1 rounded-full text-blue-200">Online</span>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- ABA 1: FORMULÁRIO -->
        <section id="aba-nova-viagem" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-route text-blue-600"></i> Registrar Nova Viagem
                </h2>

                <form id="form-viagem" onsubmit="salvarViagem(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-mail / Telefone (Identificação)</label>
                        <input type="text" id="usuarioId" required placeholder="Seu e-mail ou WhatsApp"
                            class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Motorista</label>
                        <select id="motorista" required class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
                            <option value="">Carregando motoristas...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Frota / Veículo</label>
                        <select id="frota" required onchange="aoSelecionarFrota()" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
                            <option value="">Carregando frotas...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Acompanhante (Opcional)</label>
                        <input type="text" id="acompanhante" placeholder="Nome do acompanhante"
                            class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">KM Saída</label>
                        <div class="relative">
                            <input type="number" id="kmSaida" required placeholder="Ex: 160001"
                                class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
                            <span id="loading-km" class="hidden absolute right-3 top-3 text-xs text-blue-600">Buscando KM...</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Destino</label>
                        <select id="destino" required class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
                            <option value="">Carregando destinos...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Foto do Hodômetro (Saída)</label>
                        <input type="file" id="fotoHodometro" accept="image/*" capture="environment" onchange="converterFotoBase64()" class="hidden">
                        <label for="fotoHodometro" class="w-full p-3 bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl text-blue-700 flex items-center justify-center gap-2 cursor-pointer text-sm font-medium">
                            <i class="fa-solid fa-camera text-lg"></i>
                            <span id="label-foto">Tirar Foto / Anexar</span>
                        </label>
                        <input type="hidden" id="fotoBase64">
                    </div>

                    <button type="submit" id="btn-enviar" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold p-3.5 rounded-xl shadow-lg text-base mt-2 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Registrar Saída
                    </button>
                </form>
            </div>
        </section>

        <!-- ABA 2: HISTÓRICO E ENCERRAMENTO -->
        <section id="aba-historico" class="hidden space-y-3">
            <h2 class="text-base font-bold text-gray-800 mb-2 px-1 flex justify-between items-center">
                <span><i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Viagens Recentes</span>
                <button onclick="carregarHistorico()" class="text-xs text-blue-700 font-semibold">Atualizar</button>
            </h2>
            <div id="lista-cards-historico" class="space-y-3">
                <p class="text-center text-gray-500 text-sm py-8">Carregando histórico...</p>
            </div>
        </section>
    </main>

    <!-- MODAL DE ENCERRAMENTO -->
    <div id="modal-encerrar" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4">
            <h3 class="font-bold text-gray-800 text-base border-b pb-2">Encerrar Viagem - Frota: <span id="modal-frota-txt"></span></h3>
            <input type="hidden" id="modal-linha">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">KM Chegada</label>
                <input type="number" id="modal-kmChegada" required placeholder="Ex: 160150" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-sm outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Foto Hodômetro (Chegada)</label>
                <input type="file" id="modal-fotoChegada" accept="image/*" capture="environment" onchange="converterFotoModalBase64()" class="hidden">
                <label for="modal-fotoChegada" class="w-full p-3 bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl text-blue-700 flex items-center justify-center gap-2 cursor-pointer text-sm font-medium">
                    <i class="fa-solid fa-camera"></i> <span id="modal-label-foto">Foto de Chegada</span>
                </label>
                <input type="hidden" id="modal-fotoBase64">
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="fecharModal()" class="w-1/2 bg-gray-300 text-gray-700 font-bold p-3 rounded-xl text-sm">Cancelar</button>
                <button type="button" onclick="salvarEncerramento()" class="w-1/2 bg-green-700 text-white font-bold p-3 rounded-xl text-sm">Concluir</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-50">
        <button onclick="mudarAba('nova-viagem')" id="nav-nova-viagem" class="flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs">
            <i class="fa-solid fa-circle-plus text-lg"></i><span>Nova Viagem</span>
        </button>
        <button onclick="mudarAba('historico')" id="nav-historico" class="flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs">
            <i class="fa-solid fa-list text-lg"></i><span>Histórico</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyN0w7YVnTzjVyXFyKcUaguw4j-KDOk_Tlt7MueC3DdnbNrenk_rxaqx-ZffXnJFkDCFg/exec";

        document.addEventListener("DOMContentLoaded", () => {
            carregarMotoristas();
            carregarFrotas();
            carregarDestinos();
            carregarHistorico();
        });

        function mudarAba(aba) {
            const secNova = document.getElementById("aba-nova-viagem");
            const secHist = document.getElementById("aba-historico");
            const btnNova = document.getElementById("nav-nova-viagem");
            const btnHist = document.getElementById("nav-historico");
            if (aba === 'nova-viagem') {
                secNova.classList.remove("hidden");
                secHist.classList.add("hidden");
                btnNova.className = "flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs";
                btnHist.className = "flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs";
            } else {
                secNova.classList.add("hidden");
                secHist.classList.remove("hidden");
                btnHist.className = "flex flex-col items-center gap-1 text-blue-700 font-semibold p-1 text-xs";
                btnNova.className = "flex flex-col items-center gap-1 text-gray-400 font-semibold p-1 text-xs";
            }
        }

        async function carregarMotoristas() {
            try {
                const res = await fetch(`${API_URL}?action=getMotoristas`);
                const dados = await res.json();
                const sel = document.getElementById("motorista");
                sel.innerHTML = '<option value="">Selecione o motorista...</option>';
                dados.forEach(m => sel.innerHTML += `<option value="${m}">${m}</option>`);
            } catch (e) { console.error(e); }
        }

        async function carregarFrotas() {
            try {
                const res = await fetch(`${API_URL}?action=getFrotasEmOperacao`);
                const dados = await res.json();
                const sel = document.getElementById("frota");
                sel.innerHTML = '<option value="">Selecione o veículo...</option>';
                dados.forEach(f => sel.innerHTML += `<option value="${f}">${f}</option>`);
            } catch (e) { console.error(e); }
        }

        async function carregarDestinos() {
            try {
                const res = await fetch(`${API_URL}?action=getDestinos`);
                const dados = await res.json();
                const sel = document.getElementById("destino");
                sel.innerHTML = '<option value="">Selecione o destino...</option>';
                dados.forEach(d => sel.innerHTML += `<option value="${d}">${d}</option>`);
            } catch (e) { console.error(e); }
        }

        async function aoSelecionarFrota() {
            const frota = document.getElementById("frota").value;
            const inputKm = document.getElementById("kmSaida");
            const loading = document.getElementById("loading-km");
            if (!frota) return;
            loading.classList.remove("hidden");
            try {
                const res = await fetch(`${API_URL}?action=getUltimoKm&frota=${encodeURIComponent(frota)}`);
                const data = await res.json();
                if (data.ultimoKm !== "") {
                    inputKm.value = data.ultimoKm;
                }
            } catch (e) { console.error(e); }
            finally { loading.classList.add("hidden"); }
        }

        function converterFotoBase64() {
            const file = document.getElementById("fotoHodometro").files[0];
            if (file) {
                const reader = new FileReader();
                document.getElementById("label-foto").textContent = "Foto Anexada ✓";
                reader.onload = e => document.getElementById("fotoBase64").value = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        function converterFotoModalBase64() {
            const file = document.getElementById("modal-fotoChegada").files[0];
            if (file) {
                const reader = new FileReader();
                document.getElementById("modal-label-foto").textContent = "Foto OK ✓";
                reader.onload = e => document.getElementById("modal-fotoBase64").value = e.target.result;
                reader.readAsDataURL(file);
            }
        }

        async function salvarViagem(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-enviar");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando...';

            const agora = new Date();
            const payload = {
                usuarioId: document.getElementById("usuarioId").value,
                motorista: document.getElementById("motorista").value,
                frota: document.getElementById("frota").value,
                acompanhante: document.getElementById("acompanhante").value,
                kmSaida: document.getElementById("kmSaida").value,
                destino: document.getElementById("destino").value,
                fotoBase64: document.getElementById("fotoBase64").value,
                dataSaida: agora.toLocaleDateString("pt-BR"),
                horaSaida: agora.toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'}),
                situacao: "EM ANDAMENTO"
            };

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const resp = await res.json();
                if (resp.status === "sucesso") {
                    alert("Saída registrada com sucesso!");
                    document.getElementById("form-viagem").reset();
                    document.getElementById("label-foto").textContent = "Tirar Foto / Anexar";
                    document.getElementById("fotoBase64").value = "";
                    carregarHistorico();
                    mudarAba('historico');
                } else { alert("Erro: " + resp.mensagem); }
            } catch (err) { alert("Erro de comunicação."); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Registrar Saída'; }
        }

        async function carregarHistorico() {
            const container = document.getElementById("lista-cards-historico");
            try {
                const res = await fetch(`${API_URL}?action=obterDadosFrotas`);
                const dados = await res.json();
                if (dados && dados.length > 0) {
                    container.innerHTML = "";
                    dados.slice(0, 15).forEach(v => {
                        let emAndamento = v.situacao === "EM ANDAMENTO";
                        container.innerHTML += `
                            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-blue-800 text-sm">${v.frota}</span>
                                    <span class="text-xs px-2 py-0.5 rounded font-semibold ${emAndamento ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}">${v.situacao}</span>
                                </div>
                                <div class="text-xs text-gray-600 space-y-1">
                                    <p><strong>Motorista:</strong> ${v.motorista}</p>
                                    <p><strong>Destino:</strong> ${v.destino}</p>
                                    <p><strong>Saída:</strong> ${v.saida} (KM: ${v.kmSaida})</p>
                                    ${!emAndamento ? `<p><strong>Chegada:</strong> KM ${v.kmChegada} | <strong>Rodado:</strong> ${v.kmRodado} km</p>` : ''}
                                    <div class="pt-1 flex gap-3">
                                        ${v.foto ? `<a href="${v.foto}" target="_blank" class="text-blue-600 underline font-semibold">Foto Saída</a>` : ''}
                                    </div>
                                </div>
                                ${emAndamento ? `<button onclick="abrirModalEncerrar(${v.linha}, '${v.frota}')" class="w-full mt-2 bg-green-700 text-white text-xs font-bold py-2 rounded-lg shadow">Encerrar Viagem</button>` : ''}
                            </div>
                        `;
                    });
                } else { container.innerHTML = '<p class="text-center text-gray-500 text-sm py-6">Nenhuma viagem encontrada.</p>'; }
            } catch (e) { container.innerHTML = '<p class="text-center text-red-500 text-sm py-6">Erro ao carregar histórico.</p>'; }
        }

        function abrirModalEncerrar(linha, frota) {
            document.getElementById("modal-linha").value = linha;
            document.getElementById("modal-frota-txt").textContent = frota;
            document.getElementById("modal-kmChegada").value = "";
            document.getElementById("modal-fotoBase64").value = "";
            document.getElementById("modal-label-foto").textContent = "Foto de Chegada";
            document.getElementById("modal-encerrar").classList.remove("hidden");
        }

        function fecharModal() {
            document.getElementById("modal-encerrar").classList.add("hidden");
        }

        async function salvarEncerramento() {
            const linha = document.getElementById("modal-linha").value;
            const kmChegada = document.getElementById("modal-kmChegada").value;
            const fotoBase64 = document.getElementById("modal-fotoBase64").value;

            if (!kmChegada) {
                alert("Informe o KM de chegada!");
                return;
            }

            const payload = {
                acao: "encerrar",
                linha: linha,
                kmChegada: kmChegada,
                fotoBase64: fotoBase64
            };

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const resp = await res.json();
                if (resp.status === "sucesso") {
                    alert("Viagem encerrada com sucesso!");
                    fecharModal();
                    carregarHistorico();
                } else { alert("Erro: " + resp.mensagem); }
            } catch (e) { alert("Erro de comunicação."); }
        }
    </script>
</body>
</html>
